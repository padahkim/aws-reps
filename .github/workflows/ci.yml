name: CI

# next build는 여기서 돌리지 않는다 — 빌드 검증은 Vercel 프리뷰가 담당한다 (#28).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 고정: scripts/*.mts를 node로 직접 실행하므로 type stripping이 필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run validate

      - run: npm run validate:test
