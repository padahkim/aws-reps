name: CI

# next build는 여기서 돌리지 않는다 — 빌드 검증은 Vercel 프리뷰가 담당한다 (#28).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 버전 정본은 .nvmrc (로컬 nvm/fnm과 CI가 같은 파일을 읽는다).
      # scripts/*.mts를 node로 직접 실행하므로 type stripping(Node 24+)이 필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run validate

      - run: npm run validate:test

      # 문서 신선도 게이트 (#117) — docs/ARCHITECTURE.md 의 사실 블록이
      # 코드(registry·schema·CURRICULUM·package.json)와 어긋나면 PR을 깬다.
      - run: node scripts/gen-arch-facts.mts --check
